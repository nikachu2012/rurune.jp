<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>rurune.jp</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .hero {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 40%;
    }
    .credit {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      margin: 0;
      padding: 6px 10px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      color: #fff;
      background: rgb(0 0 0 / 0.45);
      border-radius: 4px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .credit a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <!--
    object-fit: cover のため、画面が 16:9 より縦長なら高さ基準 (100vh × 16/9 = 177.78vh)、
    横長なら幅基準 (100vw) で画像が描画される。sizes でそれをブラウザに伝え、
    DPR も考慮した最適な幅の AVIF → WebP → JPEG の順に選ばせる。
  -->
  <picture class="hero">
    <source
      type="image/avif"
      sizes="(max-aspect-ratio: 16/9) 177.78vh, 100vw"
      srcset="
        images/bg-640.avif   640w,
        images/bg-960.avif   960w,
        images/bg-1280.avif 1280w,
        images/bg-1920.avif 1920w,
        images/bg-2560.avif 2560w,
        images/bg-3840.avif 3840w,
        images/bg-5120.avif 5120w,
        images/bg-7680.avif 7680w">
    <source
      type="image/webp"
      sizes="(max-aspect-ratio: 16/9) 177.78vh, 100vw"
      srcset="
        images/bg-640.webp   640w,
        images/bg-960.webp   960w,
        images/bg-1280.webp 1280w,
        images/bg-1920.webp 1920w,
        images/bg-2560.webp 2560w,
        images/bg-3840.webp 3840w,
        images/bg-5120.webp 5120w,
        images/bg-7680.webp 7680w">
    <img
      src="images/bg-1920.jpg"
      width="7680" height="4320"
      alt="VRChat で撮影した、青紫の髪に猫耳のアバターが人差し指を立てているスクリーンショット"
      fetchpriority="high"
      decoding="async">
  </picture>
  <p class="credit">
    Shot by <a href="https://vrchat.com/home/user/usr_37763b69-29f8-4260-8bdf-240e81ab1cc6" target="_blank" rel="noopener">nikachu</a> at Avatar Testing Chamber
  </p>
</body>
</html>
